# ==============================================================================
# NetShield DNS - Arquivo de Configuração Principal do dnsmasq
# Local de instalação padrão: /etc/dnsmasq.conf
# ==============================================================================

# Porta padrão de atendimento DNS
port=53

# Escutar em todas as interfaces de rede locais (ou vincular à interface de rede)
listen-address=127.0.0.1
bind-dynamic

# Desabilitar leitura do /etc/resolv.conf local para evitar loops com systemd-resolved
no-resolv
no-poll

# Servidores DNS Upstream (Consultados quando o domínio for permitido)
server=1.1.1.1
server=1.0.0.1
server=8.8.8.8

# Habilitar Cache DNS para alta performance na rede
cache-size=10000
neg-ttl=300

# Não encaminhar consultas simples ou domínios locais para os upstreams
domain-needed
bogus-priv

# Habilitar registro detalhado de todas as consultas DNS realizadas
log-queries
log-facility=/var/log/dnsmasq.log

# Incluir arquivo de bloqueio gerenciado automaticamente pelo Painel NetShield
conf-file=/etc/dnsmasq.d/netshield_blocked.conf
