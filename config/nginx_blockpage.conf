# ==============================================================================
# NetShield DNS - Configuração do Nginx (Sinkhole Block Page & Admin Proxy)
# Local: /etc/nginx/sites-available/netshield.conf
# ==============================================================================

# Servidor Catch-All HTTP (Porta 80)
# Qualquer domínio bloqueado que for acessado via HTTP cairá aqui
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # Validação e renovação automática de SSL (Let's Encrypt / Certbot)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    # Servir arquivos estáticos diretamente com cache de 7 dias
    location /static/ {
        alias /opt/netshield/web/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Repassar requisição para o backend do NetShield
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }
}

# Servidor Catch-All HTTPS (Porta 443 com certificado autoassinado)
# Evita queda brusca de conexão em conexões HTTPS
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    ssl_certificate /etc/netshield/ssl/cert.pem;
    ssl_certificate_key /etc/netshield/ssl/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    location /static/ {
        alias /opt/netshield/web/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }
}
