<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar | NetShield DNS</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="login-body">

  <main class="login-card">
    <div class="brand-wrapper" style="justify-content: center;">
      <div class="brand-icon">🛡️</div>
      <div>
        <span class="brand-name">NetShield DNS</span>
        <span class="brand-tag">Acesso Seguro</span>
      </div>
    </div>

    <div style="text-align: center;">
      <h1 style="font-size: 1.25rem; font-weight: 600;">Acesse sua Conta</h1>
      <p style="font-size: 0.85rem; color: var(--text-secondary); margin-top: 0.25rem;">
        Painel Administrativo e Portal do Assinante
      </p>
    </div>

    <div class="login-error" id="loginError" role="alert"></div>

    <form id="loginForm" style="display: flex; flex-direction: column; gap: 1rem;">
      <div class="form-group">
        <label class="form-label" for="usernameInput">Usuário</label>
        <input type="text" id="usernameInput" name="username" class="form-input" placeholder="admin ou seu usuário" autocomplete="username" required autofocus>
      </div>

      <div class="form-group">
        <label class="form-label" for="passwordInput">Senha</label>
        <input type="password" id="passwordInput" name="password" class="form-input" placeholder="••••••••" autocomplete="current-password" required>
      </div>

      <button type="submit" class="btn btn-primary" id="loginSubmitBtn" style="width: 100%; padding: 0.7rem; margin-top: 0.25rem;">
        Entrar no Painel
      </button>
    </form>

    <div style="text-align: center; font-size: 0.78rem; color: var(--text-muted); border-top: 1px solid var(--border-subtle); padding-top: 1rem;">
      Proteção de Rede &bull; DNS Privado &bull; WireGuard VPN
    </div>
  </main>

  <script>
    const loginForm = document.getElementById("loginForm");
    const loginError = document.getElementById("loginError");
    const submitBtn = document.getElementById("loginSubmitBtn");

    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      loginError.style.display = "none";
      submitBtn.disabled = true;
      submitBtn.textContent = "Autenticando...";

      const formData = new FormData(loginForm);
      try {
        const res = await fetch("/api/auth/login", { method: "POST", body: formData });
        const data = await res.json();
        if (!res.ok) {
          loginError.textContent = data.detail || "Falha ao fazer login.";
          loginError.style.display = "block";
          submitBtn.disabled = false;
          submitBtn.textContent = "Entrar no Painel";
          return;
        }
        window.location.href = data.redirect || "/admin";
      } catch (err) {
        loginError.textContent = "Erro de comunicação com o servidor.";
        loginError.style.display = "block";
        submitBtn.disabled = false;
        submitBtn.textContent = "Entrar no Painel";
      }
    });
  </script>
</body>
</html>
